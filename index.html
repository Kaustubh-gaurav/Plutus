<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6259">
<meta name="description" content="Know what you spent, what is left, and who owes you. Everything stays on your device.">
<title>Plutus</title>

<!-- Every path here is relative. An absolute path breaks at a GitHub Pages
     subpath and breaks again inside an Android WebView. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plutus">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-booting>

<!-- ── icon sprite. one family, one 24px box, 1.8 stroke, currentColor.
     Inline so nothing is fetched and everything works offline. ── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="ic-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="ic-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  <symbol id="ic-people" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="7.5" r="3.5"/></symbol>
  <symbol id="ic-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="ic-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
  <symbol id="ic-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="ic-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="ic-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"/></symbol>
  <symbol id="ic-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="ic-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></symbol>
  <symbol id="ic-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="ic-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><path d="M3 7.5V17a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H5.5A2.5 2.5 0 0 1 3 7.5Z"/><path d="M17 13h.01"/></symbol>
  <!-- category icons -->
  <symbol id="ic-food" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11h17c0 4.4-3.8 8-8.5 8s-8.5-3.6-8.5-8Z"/><path d="M8.5 8c0-1.2.9-1.6.9-2.7M12 8c0-1.2.9-1.6.9-2.7M15.5 8c0-1.2.9-1.6.9-2.7"/></symbol>
  <symbol id="ic-basket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.6 10.2H5.6L4 9Z"/><path d="M8.6 9 12 3.5 15.4 9"/></symbol>
  <symbol id="ic-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.1 12H6.1L5 8Z"/><path d="M9 8V6.2A3 3 0 0 1 15 6.2V8"/></symbol>
  <symbol id="ic-shirt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 5 6.2l1.4 4L8 9.6V20h8V9.6l1.6.6 1.4-4L15 4a3 3 0 0 1-6 0Z"/></symbol>
  <symbol id="ic-bus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12.5" rx="2.4"/><path d="M4 11h16M7.5 20v-3.5M16.5 20v-3.5M8 14h.01M16 14h.01"/></symbol>
  <symbol id="ic-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2.4"/><path d="M8.5 6v12M15.5 6v12"/></symbol>
  <symbol id="ic-receipt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-1.6-3 1.6-3-1.6L6 21V3Z"/><path d="M9.5 8h5M9.5 12h5"/></symbol>
  <symbol id="ic-plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5"/><path d="M6.5 8h11v3a5.5 5.5 0 0 1-11 0V8Z"/><path d="M12 16.5V21"/></symbol>
  <symbol id="ic-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-9.4A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20Z"/></symbol>
  <symbol id="ic-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20"/></symbol>
  <symbol id="ic-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5a1.5 1.5 0 0 1 3 0V9l7 4v2.2l-7-2v3.6l2 1.6V20l-3.5-1L8.5 20v-1.6l2-1.6v-3.6l-7 2V13l7-4V3.5Z"/></symbol>
  <symbol id="ic-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V8a3 3 0 0 1 3-3h10l-2.5-2.4M20 15v1a3 3 0 0 1-3 3H7l2.5 2.4"/></symbol>
  <symbol id="ic-dots" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h.01M12 12h.01M18 12h.01"/></symbol>
</svg>

<div id="app">

  <!-- ══ Onboarding. Outside the router: App gates on profile.onboarded ══ -->
  <section class="screen screen--onboarding" id="screen-onboarding" hidden></section>

  <!-- ══ Home. Rendered by js/screen_home.js from the store ══ -->
  <section class="screen" id="screen-home" hidden></section>

  <!-- ══ History. Rendered by js/screen_expenses.js ══ -->
  <section class="screen" id="screen-expenses" hidden></section>

  <section class="screen" id="screen-people" hidden></section>

  <section class="screen" id="screen-insights" hidden></section>

  <section class="screen" id="screen-goals" hidden></section>

  <section class="screen" id="screen-settings" hidden></section>

</div>

<!-- ══ chrome that sits above every screen ══════════════════ -->
<nav class="nav" aria-label="Main">
  <button class="nav-tab" type="button" data-tab="home" data-route="#/" aria-label="Home"><svg width="19" height="19" aria-hidden="true"><use href="#ic-home"/></svg></button>
  <button class="nav-tab" type="button" data-tab="expenses" data-route="#/expenses" aria-label="History"><svg width="19" height="19" aria-hidden="true"><use href="#ic-list"/></svg></button>
  <button class="nav-add" type="button" id="add-expense" aria-label="Add an expense"><svg width="23" height="23" aria-hidden="true"><use href="#ic-plus"/></svg></button>
  <button class="nav-tab" type="button" data-tab="people" data-route="#/people" aria-label="People"><svg width="19" height="19" aria-hidden="true"><use href="#ic-people"/></svg></button>
  <button class="nav-tab" type="button" data-tab="insights" data-route="#/insights" aria-label="Insights"><svg width="19" height="19" aria-hidden="true"><use href="#ic-chart"/></svg></button>
</nav>

<div class="scrim" id="scrim" hidden onclick="UI.closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="banner" id="banner" role="alert" hidden></div>

<!-- Load order is load bearing. These define globals in file order, and every
     one of them must also be listed in SHELL in sw.js. -->
<script src="js/config.js"></script>
<script src="js/money.js"></script>
<script src="js/dates.js"></script>
<script src="js/expenses.js"></script>
<script src="js/budget.js"></script>
<script src="js/analytics.js"></script>
<script src="js/debts.js"></script>
<script src="js/goals.js"></script>
<script src="js/alerts.js"></script>
<script src="js/recurring.js"></script>
<script src="js/validate.js"></script>
<script src="js/store.js"></script>
<script src="js/actions.js"></script>
<script src="js/ui.js"></script>
<script src="js/notifications.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/sheet_expense.js"></script>
<script src="js/screen_home.js"></script>
<script src="js/screen_expenses.js"></script>
<script src="js/sheet_debt.js"></script>
<script src="js/screen_people.js"></script>
<script src="js/screen_insights.js"></script>
<script src="js/screen_goals.js"></script>
<script src="js/screen_settings.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("version-line").textContent =
    "Plutus " + CONFIG.VERSION + ", offline and on your device";
</script>
</body>
</html>
