<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plutus tests</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px; background: #FBF5E7; color: #1A1720;
         font: 14px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { opacity: .6; margin: 0 0 20px; }
  #summary { padding: 14px 18px; border-radius: 14px; font-weight: 700;
             margin-bottom: 18px; font-size: 15px; }
  #summary[data-status="pass"] { background: #D6E7E2; color: #144C43; }
  #summary[data-status="fail"] { background: #FBDCE1; color: #9E1B33; }
  .group { margin-bottom: 16px; }
  .group > b { display: block; margin-bottom: 4px; font-size: 13px; }
  .case { padding: 2px 0 2px 16px; }
  .pass::before { content: "ok   "; color: #1F6259; }
  .fail { color: #9E1B33; font-weight: 700; }
  .fail::before { content: "FAIL "; }
  .why { padding-left: 38px; opacity: .75; }
</style>
</head>
<body>

<h1>Plutus tests</h1>
<p class="sub">The logic layer, tested with no DOM and no real storage. Green before every deploy.</p>
<div id="summary">running</div>
<div id="out"></div>

<script src="js/config.js"></script>
<script src="js/money.js"></script>
<script src="js/dates.js"></script>
<script src="js/expenses.js"></script>
<script src="js/budget.js"></script>
<script src="js/analytics.js"></script>
<script src="js/debts.js"></script>
<script src="js/goals.js"></script>
<script src="js/alerts.js"></script>
<script src="js/validate.js"></script>
<script src="js/store.js"></script>
<script src="js/actions.js"></script>

<script>
/* ── a thirty line harness. no npm, no runner, no build ── */
(function () {
  var out = document.getElementById("out");
  var passed = 0, failed = 0, group = null;

  function describe(name, fn) {
    group = document.createElement("div");
    group.className = "group";
    var b = document.createElement("b");
    b.textContent = name;
    group.appendChild(b);
    out.appendChild(group);
    try { fn(); } catch (e) { record(false, "threw outside a case", e && e.message); }
  }

  function record(ok, label, why) {
    var line = document.createElement("div");
    line.className = "case " + (ok ? "pass" : "fail");
    line.textContent = label;
    (group || out).appendChild(line);
    if (ok) passed++; else {
      failed++;
      if (why) {
        var w = document.createElement("div");
        w.className = "why";
        w.textContent = why;
        (group || out).appendChild(w);
      }
    }
  }

  function it(label, fn) {
    try { fn(); record(true, label); }
    catch (e) { record(false, label, e && e.message); }
  }

  function eq(actual, expected, note) {
    var a = JSON.stringify(actual), b = JSON.stringify(expected);
    if (a !== b) throw new Error((note ? note + ": " : "") + "expected " + b + ", got " + a);
  }
  function ok(v, note) { if (!v) throw new Error(note || "expected truthy"); }
  function notOk(v, note) { if (v) throw new Error(note || "expected falsy"); }

  /* A storage object that behaves like localStorage, and can be told to fail
     the way a real one does when the quota runs out. */
  function fakeStorage(opts) {
    opts = opts || {};
    var map = {};
    return {
      _map: map,
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(map, k) ? map[k] : null; },
      setItem: function (k, v) {
        if (opts.full) { var e = new Error("QuotaExceededError"); e.name = "QuotaExceededError"; throw e; }
        map[k] = String(v);
      },
      removeItem: function (k) { delete map[k]; }
    };
  }

  var FIXED = "2026-08-16T10:00:00.000Z";
  Store.__setNow(function () { return FIXED; });

  /* ───────────────────────────────────────────────────────── */

  describe("store: a fresh device", function () {
    var fs = fakeStorage();
    Store.__setBackend(fs);
    Store.load();
    var s = Store.get();

    it("starts not onboarded", function () { eq(s.profile.onboarded, false); });
    it("defaults to Indian rupees and Indian grouping", function () {
      eq(s.profile.currencyCode, "INR");
      eq(s.profile.grouping, "IN");
    });
    it("starts the week on Monday", function () { eq(s.profile.weekStartsOn, 1); });
    it("seeds the default categories once", function () {
      eq(s.categories.length, CONFIG.DEFAULT_CATEGORIES.length);
      ok(s.categories[0].isDefault, "seeded categories are marked default");
    });
    it("holds no expenses, debts, goals or contributions", function () {
      eq(s.expenses.length, 0); eq(s.debts.length, 0);
      eq(s.goals.length, 0); eq(s.contributions.length, 0);
    });
    it("writes itself to storage on first load", function () {
      ok(fs.getItem(CONFIG.STORE_KEY), "first load persists the seeded store");
    });
    it("does not seed a second time", function () {
      Store.load();
      eq(Store.get().categories.length, CONFIG.DEFAULT_CATEGORIES.length);
    });
  });

  describe("store: it survives a restart", function () {
    var fs = fakeStorage();
    Store.__setBackend(fs);
    Store.load();
    Store.setProfile({ name: "Kaustubh", onboarded: true });
    Store.insert("expenses", { amount: 42000, categoryId: "cat_1", date: "2026-08-16" }, "exp");

    it("reads back exactly what was written", function () {
      Store.load();
      var s = Store.get();
      eq(s.profile.name, "Kaustubh");
      eq(s.profile.onboarded, true);
      eq(s.expenses.length, 1);
      eq(s.expenses[0].amount, 42000);
    });
    it("keeps ids unique across a restart", function () {
      var a = Store.insert("expenses", { amount: 100, date: "2026-08-16" }, "exp").value.id;
      Store.load();
      var b = Store.insert("expenses", { amount: 100, date: "2026-08-16" }, "exp").value.id;
      ok(a !== b, "ids must not repeat after a reload, got " + a + " twice");
    });
  });

  describe("store: a value written by an older build", function () {
    var fs = fakeStorage();
    fs.setItem(CONFIG.STORE_KEY, JSON.stringify({
      schemaVersion: 1,
      profile: { name: "Old" },
      expenses: [{ id: "exp_1", amount: 500, date: "2026-07-01" }]
    }));
    Store.__setBackend(fs);
    Store.load();
    var s = Store.get();

    it("keeps the fields that were there", function () {
      eq(s.profile.name, "Old");
      eq(s.expenses.length, 1);
    });
    it("fills in every field that was missing", function () {
      eq(s.profile.weekStartsOn, 1);
      eq(s.settings.thresholds, CONFIG.DEFAULT_THRESHOLDS);
      eq(s.goals, []);
      eq(s.contributions, []);
      eq(s.firedAlerts, {});
    });
    it("does not crash on a missing collection", function () {
      ok(Array.isArray(s.debts) && Array.isArray(s.repayments));
    });
  });

  describe("store: a corrupt value", function () {
    var fs = fakeStorage();
    fs.setItem(CONFIG.STORE_KEY, "{ this is not json");
    Store.__setBackend(fs);
    Store.load();

    it("boots to a usable blank store", function () {
      eq(Store.get().expenses.length, 0);
      ok(Store.get().categories.length > 0, "categories still seeded");
    });
    it("reports the failure so the app can say so", function () {
      eq(Store.loadError(), "corrupt");
    });
    it("does NOT overwrite the corrupt value", function () {
      eq(fs.getItem(CONFIG.STORE_KEY), "{ this is not json");
    });
  });

  describe("store: storage that refuses to write", function () {
    var fs = fakeStorage({ full: true });
    Store.__setBackend(fs);
    Store.load();

    it("reports the write as failed rather than swallowing it", function () {
      notOk(Store.save(), "save must return false when storage refuses");
      ok(Store.saveBlocked(), "saveBlocked must be set so the UI can warn");
    });
    it("still lets the app run in memory", function () {
      var r = Store.insert("expenses", { amount: 100, date: "2026-08-16" }, "exp");
      notOk(r.ok, "the write is reported as not landed");
      eq(Store.get().expenses.length, 1, "but the record is in memory");
    });
  });

  describe("store: collections", function () {
    var fs = fakeStorage();
    Store.__setBackend(fs);
    Store.load();

    var made = Store.insert("debts", {
      direction: "lent", personName: "Rahul", originalAmount: 500000, date: "2026-07-12"
    }, "debt").value;

    it("stamps an id and timestamps on insert", function () {
      ok(made.id, "id");
      eq(made.createdAt, FIXED);
      eq(made.updatedAt, FIXED);
    });
    it("finds a record by id", function () {
      eq(Store.byId("debts", made.id).personName, "Rahul");
    });
    it("patches without touching id or createdAt", function () {
      Store.update("debts", made.id, { personName: "Rahul S", id: "hacked", createdAt: "nope" });
      var d = Store.byId("debts", made.id);
      eq(d.personName, "Rahul S");
      eq(d.id, made.id);
      eq(d.createdAt, FIXED);
    });
    it("filters with where", function () {
      Store.insert("debts", { direction: "borrowed", personName: "Priya", originalAmount: 300000, date: "2026-08-01" }, "debt");
      eq(Store.where("debts", function (d) { return d.direction === "lent"; }).length, 1);
    });
    it("removes a record", function () {
      Store.remove("debts", made.id);
      eq(Store.byId("debts", made.id), null);
    });
    it("reports a missing record rather than throwing", function () {
      eq(Store.remove("debts", "nope").ok, false);
      eq(Store.update("debts", "nope", {}).ok, false);
    });
    it("refuses an unknown collection", function () {
      var threw = false;
      try { Store.insert("nonsense", {}); } catch (e) { threw = true; }
      ok(threw, "an unknown collection must throw, not silently create one");
    });
  });

  describe("store: repayments and contributions are their own records", function () {
    var fs = fakeStorage();
    Store.__setBackend(fs);
    Store.load();

    var debt = Store.insert("debts", {
      direction: "lent", personName: "Rahul", originalAmount: 500000, date: "2026-07-12"
    }, "debt").value;
    Store.insert("repayments", { debtId: debt.id, amount: 200000, date: "2026-08-01" }, "rep");

    var goal = Store.insert("goals", { name: "New laptop", targetAmount: 8000000 }, "goal").value;
    Store.insert("contributions", { goalId: goal.id, amount: 4500000, date: "2026-08-05" }, "con");

    it("never mutates the original debt amount", function () {
      eq(Store.byId("debts", debt.id).originalAmount, 500000);
    });
    it("keeps the repayment as a separate record", function () {
      var reps = Store.where("repayments", function (r) { return r.debtId === debt.id; });
      eq(reps.length, 1);
      eq(reps[0].amount, 200000);
    });
    it("keeps goal contributions the same way, so a goal has a history", function () {
      var cons = Store.where("contributions", function (c) { return c.goalId === goal.id; });
      eq(cons.length, 1);
      eq(cons[0].amount, 4500000);
      eq(Store.byId("goals", goal.id).targetAmount, 8000000);
    });
  });

  describe("store: export, import and reset", function () {
    var fs = fakeStorage();
    Store.__setBackend(fs);
    Store.load();
    Store.setProfile({ name: "Kaustubh", onboarded: true });
    Store.insert("expenses", { amount: 42000, categoryId: "cat_1", date: "2026-08-16" }, "exp");
    var backup = Store.exportAll();

    it("exports a labelled backup", function () {
      eq(backup.app, "Plutus");
      eq(backup.schemaVersion, CONFIG.SCHEMA_VERSION);
      eq(backup.data.expenses.length, 1);
    });
    it("exports a copy, not a live reference", function () {
      Store.insert("expenses", { amount: 999, date: "2026-08-16" }, "exp");
      eq(backup.data.expenses.length, 1, "the backup must not change underneath you");
    });
    it("reset wipes the data but keeps the app usable", function () {
      Store.reset();
      eq(Store.get().expenses.length, 0);
      eq(Store.get().profile.onboarded, false);
      ok(Store.get().categories.length > 0, "categories are seeded again");
    });
    it("import restores the exact same state", function () {
      Store.importAll(backup);
      var s = Store.get();
      eq(s.profile.name, "Kaustubh");
      eq(s.profile.onboarded, true);
      eq(s.expenses.length, 1);
      eq(s.expenses[0].amount, 42000);
    });
    it("import refuses something that is not a backup", function () {
      eq(Store.importAll("hello").ok, false);
      eq(Store.importAll(null).ok, false);
    });
    it("an export and a fresh import round trip exactly", function () {
      var again = Store.exportAll();
      Store.reset();
      Store.importAll(again);
      eq(Store.exportAll().data.expenses, again.data.expenses);
    });
  });

  /* ═══════════════ Phase 2: the logic layer ═══════════════
     Every function below is pure and takes today as an argument, which is
     what lets a month rollover and an overdue transition be a test rather
     than something you wait for. */

  var TODAY = "2026-08-16";            /* a Sunday */
  var MONTH = Dates.monthPeriod(TODAY);
  var WEEK = Dates.weekPeriod(TODAY, 1);

  function exp(amount, date, categoryId, extra) {
    var e = { id: "e" + Math.random().toString(36).slice(2, 8), amount: amount,
              date: date, categoryId: categoryId || "cat_1" };
    for (var k in (extra || {})) e[k] = extra[k];
    return e;
  }

  describe("money: paise in, rupees out", function () {
    it("converts and rounds half up", function () {
      eq(Money.toPaise(1234.56), 123456);
      eq(Money.toPaise(0.005), 1);
      eq(Money.toPaise(10), 1000);
    });
    it("does not lose a paisa to binary floating point", function () {
      /* 1234.565 * 100 is 123456.49999999999 in IEEE 754. A bare Math.round
         gives 123456 and the paisa is gone. */
      eq(Money.toPaise(1234.565), 123457);
      eq(Money.toPaise(0.07 * 3), Money.toPaise(0.21));
    });
    it("stays exact over a thousand additions", function () {
      var list = [];
      for (var i = 0; i < 1000; i++) list.push({ amount: Money.toPaise(0.1) });
      eq(Money.sum(list, function (x) { return x.amount; }), 10000);
    });
    it("returns zero rather than NaN when there is no whole", function () {
      eq(Money.percentOf(500, 0), 0);
      eq(Money.percentOf(0, 0), 0);
    });
    it("groups the Indian way", function () {
      eq(Money.format(12500000, "₹", "IN"), "₹1,25,000");
      eq(Money.format(100000000, "₹", "IN"), "₹10,00,000");
      eq(Money.format(99900, "₹", "IN"), "₹999");
    });
    it("groups the international way when asked", function () {
      eq(Money.format(12500000, "$", "INTL"), "$125,000");
    });
    it("shows decimals only when there are any", function () {
      eq(Money.format(150000, "₹", "IN"), "₹1,500");
      eq(Money.format(150050, "₹", "IN"), "₹1,500.50");
      eq(Money.format(150005, "₹", "IN"), "₹1,500.05");
    });
    it("compacts to thousands, lakh and crore", function () {
      eq(Money.formatCompact(1200000, "₹", "IN"), "₹12k");
      eq(Money.formatCompact(1250000000, "₹", "IN"), "₹1.3Cr");
      eq(Money.formatCompact(20000000, "₹", "IN"), "₹2L");
      eq(Money.formatCompact(82967, "₹", "IN"), "₹830", "the compact form drops paise");
    });
    it("reads what a person actually types", function () {
      eq(Money.parseInput("₹1,25,000"), 12500000);
      eq(Money.parseInput(" 420 "), 42000);
      eq(Money.parseInput("10.5"), 1050);
      eq(Money.parseInput("10.005"), 1001);
    });
    it("refuses what is not a number", function () {
      eq(Money.parseInput("abc"), null);
      eq(Money.parseInput(""), null);
      eq(Money.parseInput("."), null);
      eq(Money.parseInput("1.2.3"), null);
    });
    it("never lets a balance go negative", function () {
      eq(Money.clampToZero(-500), 0);
    });
  });

  describe("dates: months, weeks and their edges", function () {
    it("finds the month a date sits in", function () {
      eq(MONTH.key, "2026-08");
      eq(MONTH.start, "2026-08-01");
      eq(MONTH.end, "2026-08-31");
      eq(MONTH.totalDays, 31);
    });
    it("handles February, leap year and not", function () {
      eq(Dates.monthPeriod("2026-02-10").end, "2026-02-28");
      eq(Dates.monthPeriod("2028-02-10").end, "2028-02-29");
    });
    it("counts days elapsed from the first to the last day", function () {
      eq(Dates.monthPeriod("2026-08-01").daysElapsed, 1);
      eq(Dates.monthPeriod("2026-08-31").daysElapsed, 31);
      eq(Dates.monthPeriod("2026-08-31").daysLeft, 0);
      eq(MONTH.daysElapsed, 16);
      eq(MONTH.daysLeft, 15);
    });
    it("starts the week on Monday by default", function () {
      eq(WEEK.start, "2026-08-10");
      eq(WEEK.end, "2026-08-16");
    });
    it("starts the week on Sunday when asked", function () {
      var w = Dates.weekPeriod(TODAY, 0);
      eq(w.start, "2026-08-16");
      eq(w.end, "2026-08-22");
    });
    it("puts a date on a period edge inside that period", function () {
      ok(Dates.isWithin("2026-08-01", MONTH));
      ok(Dates.isWithin("2026-08-31", MONTH));
      notOk(Dates.isWithin("2026-07-31", MONTH));
      notOk(Dates.isWithin("2026-09-01", MONTH));
    });
    it("steps back a period, including across a year boundary", function () {
      eq(Dates.previousPeriod(MONTH, 1).key, "2026-07");
      eq(Dates.previousPeriod(Dates.monthPeriod("2026-01-10"), 1).key, "2025-12");
    });
    it("keeps the week key stable across new year", function () {
      /* the Thursday rule: 1 January 2027 is a Friday, so it belongs to the
         last ISO week of 2026, not the first of 2027 */
      eq(Dates.weekPeriod("2027-01-01", 1).key, "2026-W53");
    });
    it("rejects a date that does not exist", function () {
      notOk(Dates.isValid("2026-02-30"));
      notOk(Dates.isValid("16-08-2026"));
      ok(Dates.isValid("2026-08-16"));
    });
    it("reads dates the way a person says them", function () {
      eq(Dates.formatRelativeDay(TODAY, TODAY), "Today");
      eq(Dates.formatRelativeDay("2026-08-15", TODAY), "Yesterday");
      eq(Dates.formatDisplay("2026-08-16", TODAY), "16 August");
      eq(Dates.formatDisplay("2025-08-16", TODAY), "16 August 2025");
    });
  });

  describe("budget: progress and its edges", function () {
    var spend = [exp(1500000, "2026-08-05"), exp(1000000, "2026-08-12")]; /* 25,000 in total */

    it("survives a brand new user with no budget", function () {
      var p = Budget.progress(null, [], MONTH);
      eq(p.hasBudget, false);
      eq(p.status, "no_budget");
      eq(p.percentUsed, 0);
      eq(p.remaining, 0);
      ok(isFinite(p.averageDailySpend), "no NaN anywhere");
    });
    it("treats a zero budget as no budget rather than dividing by it", function () {
      var p = Budget.progress(0, spend, MONTH);
      eq(p.hasBudget, false);
      eq(p.percentUsed, 0);
      eq(p.spent, 2500000);
    });
    it("computes the ordinary case", function () {
      var p = Budget.progress(2500000, [exp(1500000, "2026-08-05")], MONTH);
      eq(p.spent, 1500000);
      eq(p.remaining, 1000000);
      eq(Math.round(p.percentUsed), 60);
      eq(p.status, "approaching");
      eq(p.surface, "warn");
    });
    it("lands exactly on the band boundaries", function () {
      function statusAt(pct) { return Budget.statusFromPercent(pct, true); }
      eq(statusAt(0), "starting");
      eq(statusAt(49), "on_track");
      eq(statusAt(50), "approaching");
      eq(statusAt(74), "approaching");
      eq(statusAt(75), "near_limit");
      eq(statusAt(99), "near_limit");
      eq(statusAt(100), "at_limit");
      eq(statusAt(101), "exceeded");
    });
    it("reports overspend rather than a negative remaining", function () {
      var p = Budget.progress(2500000, [exp(2750000, "2026-08-05")], MONTH);
      eq(p.remaining, 0);
      eq(p.overspend, 250000);
      eq(p.status, "exceeded");
      eq(p.surface, "danger");
    });
    it("splits the bar into inside and overspend", function () {
      var p = Budget.progress(2500000, [exp(2750000, "2026-08-05")], MONTH);
      var seg = Budget.barSegments(p);
      eq(Math.round(seg.inside + seg.over), 100);
      ok(seg.over > 0, "there must be a hatched segment when over budget");
    });
    it("warns about pace while still inside the budget", function () {
      /* 16 days in, 20,000 spent of 25,000: not over, but heading there */
      var p = Budget.progress(2500000, [exp(2000000, "2026-08-05")], MONTH);
      eq(p.status, "near_limit");
      ok(p.isPaceRisky, "projected total must exceed the budget");
      ok(p.projectedTotal > p.budget);
    });
    it("floors the safe daily allowance to whole rupees, never rounds it up", function () {
      /* 15 days left, 19,000 remaining. 1,266.67 a day would put you over. */
      var p = Budget.progress(2500000, [exp(600000, "2026-08-05")], MONTH);
      eq(p.remaining, 1900000);
      eq(p.safeDailyRemaining, 126600);
      ok(p.safeDailyRemaining * p.period.daysLeft <= p.remaining,
         "spending the allowance every remaining day must stay inside the budget");
    });

    it("does not cry pace when spending is comfortable", function () {
      var p = Budget.progress(2500000, [exp(500000, "2026-08-05")], MONTH);
      notOk(p.isPaceRisky);
    });
    it("picks the budget that was in force, not the newest one", function () {
      var budgets = [
        { id: "b1", period: "monthly", amount: 2000000, effectiveFrom: "2026-06-01", createdAt: "1" },
        { id: "b2", period: "monthly", amount: 2500000, effectiveFrom: "2026-08-01", createdAt: "2" },
        { id: "b3", period: "monthly", amount: 9900000, effectiveFrom: "2026-09-01", createdAt: "3" }
      ];
      eq(Budget.resolveForPeriod(budgets, MONTH).amount, 2500000);
      eq(Budget.resolveForPeriod(budgets, Dates.monthPeriod("2026-07-10")).amount, 2000000);
    });
    it("ignores a weekly budget when asked for a monthly one", function () {
      var budgets = [{ id: "w", period: "weekly", amount: 700000, effectiveFrom: "2026-08-01", createdAt: "1" }];
      eq(Budget.resolveForPeriod(budgets, MONTH), null);
    });
  });

  describe("expenses: filtering, grouping and the edit that moves months", function () {
    var cats = { cat_1: { id: "cat_1", name: "Food" }, cat_2: { id: "cat_2", name: "Transport" } };
    var list = [
      exp(50000, "2026-08-16", "cat_1", { note: "Lunch at Anand", paymentMethod: "upi" }),
      exp(20000, "2026-08-16", "cat_2", { note: "Bus", paymentMethod: "cash" }),
      exp(90000, "2026-08-14", "cat_1", { merchant: "Blue Tokai" }),
      exp(10000, "2026-07-30", "cat_1", { note: "Old month" })
    ];

    it("keeps only the period asked for", function () {
      eq(Expenses.inPeriod(list, MONTH).length, 3);
    });
    it("moves an expense between months when its date is edited", function () {
      var edited = list.map(function (e) {
        return e.note === "Old month" ? { id: e.id, amount: e.amount, date: "2026-08-02", categoryId: e.categoryId } : e;
      });
      eq(Expenses.inPeriod(edited, MONTH).length, 4);
      eq(Expenses.inPeriod(edited, Dates.monthPeriod("2026-07-10")).length, 0);
    });
    it("searches notes, merchants and category names", function () {
      eq(Expenses.query(list, { search: "anand" }, cats).length, 1);
      eq(Expenses.query(list, { search: "blue tokai" }, cats).length, 1);
      eq(Expenses.query(list, { search: "transport" }, cats).length, 1);
    });
    it("filters by category, method, range and amount", function () {
      eq(Expenses.query(list, { categoryIds: ["cat_1"] }).length, 3);
      eq(Expenses.query(list, { paymentMethods: ["upi"] }).length, 1);
      eq(Expenses.query(list, { from: "2026-08-01", to: "2026-08-15" }).length, 1);
      eq(Expenses.query(list, { minAmount: 50000 }).length, 2);
    });
    it("sorts newest first by default and by amount when asked", function () {
      eq(Expenses.query(list, {})[0].date, "2026-08-16");
      eq(Expenses.query(list, { sortBy: "amount" })[0].amount, 90000);
      eq(Expenses.query(list, { sortBy: "amount", sortDir: "asc" })[0].amount, 10000);
    });
    it("groups by day with a day total, newest day first", function () {
      var groups = Expenses.groupByDay(Expenses.inPeriod(list, MONTH));
      eq(groups[0].date, "2026-08-16");
      eq(groups[0].total, 70000);
      eq(groups.length, 2);
    });
    it("gives every day of the period a bar, zeros included", function () {
      var days = Expenses.dailyTotals(list, WEEK);
      eq(days.length, 7);
      eq(days[days.length - 1].total, 70000);
      eq(days[0].total, 0, "Monday had nothing and must still be drawn");

  describe("analytics: where the money went", function () {

    var list = [exp(650000, "2026-08-04", "cat_1"), exp(210000, "2026-08-06", "cat_2"),

    it("totals, counts and averages", function () {
      eq(a.total, 1000000);

    });
    it("ranks categories with their share", function () {
      eq(a.byCategory[0].categoryId, "cat_1");
      eq(a.byCategory[0].total, 790000);
      eq(Math.round(a.byCategory[0].share), 79);
      eq(a.topCategory.categoryId, "cat_1");

    it("names the biggest category", function () {
      var out = Analytics.insights(a, Budget.progress(2500000, list, MONTH), cats, "₹", "IN");
      ok(out.some(function (i) { return i.id === "top-category" && i.text.indexOf("Food") === 0; }));

      var out = Analytics.insights(Analytics.analyse(over, MONTH),
                                   Budget.progress(2500000, over, MONTH), cats, "₹", "IN");

    it("has no comparison to make in a first month", function () {

  describe("debts: the rules that cannot be got wrong", function () {
    var debt = { id: "d1", direction: "lent", personName: "Rahul",
                 originalAmount: 500000, date: "2026-07-12", dueDate: "2026-09-10" };

    it("starts pending with the full amount outstanding", function () {
      var v = Debts.view(debt, [], TODAY);
      eq(v.status, "pending");
      eq(v.remaining, 500000);
      eq(v.totalRepaid, 0);
    });
    it("goes partially paid and keeps the original amount", function () {
      var v = Debts.view(debt, [{ id: "r1", debtId: "d1", amount: 200000, date: "2026-08-01" }], TODAY);
      eq(v.status, "partially_paid");
      eq(v.remaining, 300000);
      eq(v.originalAmount, 500000, "the original must never be rewritten");
      eq(Math.round(v.repaidPercent), 40);
    });
    it("settles to exactly zero and marks itself paid", function () {
      var v = Debts.view(debt, [
        { id: "r1", debtId: "d1", amount: 200000, date: "2026-08-01" },
        { id: "r2", debtId: "d1", amount: 300000, date: "2026-08-14" }
      ], TODAY);
      eq(v.remaining, 0);
      eq(v.status, "paid");
      eq(v.repayments.length, 2, "the history is kept");
    });
    it("goes back to partially paid when a repayment is deleted", function () {
      var both = [{ id: "r1", debtId: "d1", amount: 200000, date: "2026-08-01" },
                  { id: "r2", debtId: "d1", amount: 300000, date: "2026-08-14" }];
      eq(Debts.view(debt, both, TODAY).status, "paid");
      var afterDelete = both.filter(function (r) { return r.id !== "r2"; });
      eq(Debts.view(debt, afterDelete, TODAY).status, "partially_paid");
      eq(Debts.view(debt, afterDelete, TODAY).remaining, 300000);
    });
    it("orders two repayments on the same day deterministically", function () {
      var reps = [
        { id: "r1", debtId: "d1", amount: 100000, date: "2026-08-01", createdAt: "2026-08-01T09:00:00Z" },
        { id: "r2", debtId: "d1", amount: 150000, date: "2026-08-01", createdAt: "2026-08-01T17:00:00Z" }
      ];
      eq(Debts.view(debt, reps, TODAY).repayments.map(function (r) { return r.id; }), ["r2", "r1"]);
      eq(Debts.view(debt, reps.slice().reverse(), TODAY).repayments.map(function (r) { return r.id; }), ["r2", "r1"],
         "the input order must not change the output order");
    });

    it("refuses a repayment one paisa over the balance", function () {
      var v = Debts.view(debt, [], TODAY);
      eq(Debts.canAcceptRepayment(v, 500001).ok, false);
      eq(Debts.canAcceptRepayment(v, 500000).ok, true);
    });
    it("refuses a repayment on a settled debt", function () {
      var v = Debts.view(debt, [{ id: "r", debtId: "d1", amount: 500000, date: "2026-08-01" }], TODAY);
      eq(Debts.canAcceptRepayment(v, 100).ok, false);
    });
    it("refuses a repayment dated before the debt", function () {
      var v = Debts.view(debt, [], TODAY);
      eq(Debts.canAcceptRepayment(v, 1000, "2026-07-01").ok, false);
      eq(Debts.canAcceptRepayment(v, 1000, "2026-07-12").ok, true);
    });
    it("never calls a debt without a due date overdue", function () {
      var noDue = { id: "d2", direction: "lent", personName: "X", originalAmount: 1000, date: "2020-01-01" };
      var v = Debts.view(noDue, [], TODAY);
      eq(v.isOverdue, false);
      eq(v.status, "pending");
      eq(v.daysUntilDue, null);
    });
    it("marks a passed due date overdue, and un marks it once paid", function () {
      var late = { id: "d3", direction: "lent", personName: "Ananya",
                   originalAmount: 120000, date: "2026-07-01", dueDate: "2026-08-10" };
      eq(Debts.view(late, [], TODAY).status, "overdue");
      eq(Debts.view(late, [{ id: "r", debtId: "d3", amount: 120000, date: "2026-08-15" }], TODAY).status, "paid");
    });
    it("keeps the two directions apart in the summary", function () {
      var all = [
        { id: "a", direction: "lent", personName: "Rahul", originalAmount: 500000, date: "2026-07-12" },
        { id: "b", direction: "borrowed", personName: "Priya", originalAmount: 300000, date: "2026-08-01" }
      ];
      var reps = [{ id: "r", debtId: "a", amount: 200000, date: "2026-08-01" }];
      var s = Debts.summary(Debts.views(all, reps, TODAY));
      eq(s.totalOwedToMe, 300000);
      eq(s.totalIOwe, 300000);
      eq(s.netPosition, 0);
    });
    it("puts what needs attention at the top and settled at the bottom", function () {
      var all = [
        { id: "settled", direction: "lent", personName: "Meera", originalAmount: 80000, date: "2026-07-01" },
        { id: "late", direction: "lent", personName: "Ananya", originalAmount: 120000, date: "2026-07-01", dueDate: "2026-08-10" },
        { id: "open", direction: "lent", personName: "Rahul", originalAmount: 500000, date: "2026-07-12" }
      ];
      var reps = [{ id: "r", debtId: "settled", amount: 80000, date: "2026-08-02" }];
      var ordered = Debts.views(all, reps, TODAY).map(function (v) { return v.id; });
      eq(ordered[0], "late");
      eq(ordered[2], "settled");
    });
  });

  describe("goals: a debt turned around", function () {
    var goal = { id: "g1", name: "New laptop", targetAmount: 8000000, targetDate: "2026-12-01" };
    var cons = [{ id: "c1", goalId: "g1", amount: 3000000, date: "2026-07-01" },
                { id: "c2", goalId: "g1", amount: 1500000, date: "2026-08-01" }];

    it("adds up the contributions and keeps them", function () {
      var v = Goals.view(goal, cons, TODAY);
      eq(v.saved, 4500000);
      eq(v.remaining, 3500000);
      eq(Math.round(v.percent), 56);
      eq(v.contributions.length, 2);
    });
    it("caps progress at a hundred and allows saving past the target", function () {
      var over = cons.concat([{ id: "c3", goalId: "g1", amount: 9000000, date: "2026-08-10" }]);
      var v = Goals.view(goal, over, TODAY);
      eq(v.percent, 100);
      eq(v.remaining, 0);
      eq(v.isComplete, true);
      eq(Goals.canAcceptContribution(v, 100000).ok, true, "saving more than planned is not an error");
    });
    it("works with no target date at all", function () {
      var v = Goals.view({ id: "g2", name: "Rainy day", targetAmount: 100000 }, [], TODAY);
      eq(v.daysLeft, null);
      eq(v.perMonthNeeded, null);
      eq(v.isOverdue, false);
    });
  });

  describe("alerts: fire once, and only once", function () {
    var settings = { notifications: true, budgetAlerts: true, thresholds: [50, 75, 90, 100],
                     dueReminders: true, dueReminderDays: 3 };

    function ctxAt(spentPaise, fired) {
      return {
        monthly: Budget.progress(2500000, [exp(spentPaise, "2026-08-05")], MONTH),
        weekly: null, debtViews: [], goalViews: [],
        settings: settings, today: TODAY, fired: fired || {}
      };
    }

    it("announces the highest threshold crossed, not every one below it", function () {
      var out = Alerts.evaluate(ctxAt(2000000));
      eq(out.length, 1);
      eq(out[0].type, "budget_threshold_75");
    });
    it("does not fire the same alert twice in one period", function () {
      var fired = {};
      var first = Alerts.evaluate(ctxAt(2000000, fired));
      first.forEach(function (a) { fired[a.fingerprint] = TODAY; });
      eq(Alerts.evaluate(ctxAt(2000000, fired)).length, 0);
    });
    it("does not refire after dropping below and crossing again", function () {
      var fired = {};
      Alerts.evaluate(ctxAt(2000000, fired)).forEach(function (a) { fired[a.fingerprint] = TODAY; });
      Alerts.evaluate(ctxAt(500000, fired));            /* an expense was deleted */
      eq(Alerts.evaluate(ctxAt(2000000, fired)).length, 0, "crossing 75 again in the same month is silent");
    });
    it("fires again in the next period", function () {
      var fired = {};
      Alerts.evaluate(ctxAt(2000000, fired)).forEach(function (a) { fired[a.fingerprint] = TODAY; });
      var nextMonth = Dates.monthPeriod("2026-09-16");
      var ctx = {
        monthly: Budget.progress(2500000, [exp(2000000, "2026-09-05")], nextMonth),
        settings: settings, today: "2026-09-16", fired: fired, debtViews: [], goalViews: []
      };
      eq(Alerts.evaluate(ctx).length, 1, "the fingerprint carries the period key");
    });
    it("says over budget rather than a threshold once past it", function () {
      var out = Alerts.evaluate(ctxAt(2750000));
      eq(out[0].type, "budget_exceeded");
      eq(out[0].tone, "danger");
    });
    it("goes quiet when notifications are switched off", function () {
      var ctx = ctxAt(2750000);
      ctx.settings = { notifications: false };
      eq(Alerts.evaluate(ctx).length, 0);
    });
    it("reminds about a debt due soon, once per due date", function () {
      var soon = { id: "d9", direction: "lent", personName: "Rahul",
                   originalAmount: 100000, date: "2026-08-01", dueDate: "2026-08-18" };
      var fired = {};
      var ctx = { monthly: null, weekly: null, goalViews: [], settings: settings, today: TODAY,
                  fired: fired, debtViews: [Debts.view(soon, [], TODAY)] };
      var out = Alerts.evaluate(ctx);
      eq(out.length, 1);
      eq(out[0].type, "debt_due_soon");
      fired[out[0].fingerprint] = TODAY;
      eq(Alerts.evaluate(ctx).length, 0, "it must not nag every refresh");
    });
    it("stays silent about a debt with no due date", function () {
      var noDue = { id: "d8", direction: "lent", personName: "X", originalAmount: 100000, date: "2020-01-01" };
      var ctx = { monthly: null, weekly: null, goalViews: [], settings: settings, today: TODAY,
                  fired: {}, debtViews: [Debts.view(noDue, [], TODAY)] };
      eq(Alerts.evaluate(ctx).length, 0);
    });
  });

  describe("validation: every rule, passing and failing", function () {
    var cats = [{ id: "cat_1", name: "Food" }, { id: "cat_2", name: "Transport" }];

    it("accepts a good expense and rejects a bad one", function () {
      eq(Validate.expense({ amount: 42000, categoryId: "cat_1", date: TODAY }, cats, TODAY).ok, true);
      eq(Validate.expense({ amount: 0, categoryId: "cat_1", date: TODAY }, cats, TODAY).ok, false);
      eq(Validate.expense({ amount: 100, categoryId: "nope", date: TODAY }, cats, TODAY).ok, false);
      eq(Validate.expense({ amount: 100, categoryId: "cat_1", date: "2026-09-01" }, cats, TODAY).ok, false);
    });
    it("keeps a note within its limit", function () {
      var long = new Array(220).join("x");
      eq(Validate.expense({ amount: 100, categoryId: "cat_1", date: TODAY, note: long }, cats, TODAY).ok, false);
    });
    it("refuses a duplicate category name, case insensitively", function () {
      eq(Validate.category({ name: "food" }, cats).ok, false);
      eq(Validate.category({ name: "Fuel" }, cats).ok, true);
      eq(Validate.category({ name: "" }, cats).ok, false);
    });
    it("refuses a due date before the loan itself", function () {
      var base = { personName: "Rahul", direction: "lent", originalAmount: 5000, date: "2026-08-01" };
      base.dueDate = "2026-07-01";
      eq(Validate.debt(base, TODAY).ok, false);
      base.dueDate = "2026-09-01";
      eq(Validate.debt(base, TODAY).ok, true);
    });
    it("refuses a goal target date in the past", function () {
      eq(Validate.goal({ name: "Laptop", targetAmount: 100000, targetDate: "2020-01-01" }, TODAY).ok, false);
      eq(Validate.goal({ name: "Laptop", targetAmount: 100000 }, TODAY).ok, true);
    });
    it("refuses a recurring rule that ends before it starts", function () {
      eq(Validate.recurring({ amount: 1000, categoryId: "cat_1", frequency: "monthly",
                              startDate: "2026-08-01", endDate: "2026-07-01" }, cats).ok, false);
      eq(Validate.recurring({ amount: 1000, categoryId: "cat_1", frequency: "monthly",
                              startDate: "2026-08-01" }, cats).ok, true);
    });
    it("uses one definition of a valid repayment, not two", function () {
      var v = Debts.view({ id: "d1", direction: "lent", personName: "R",
                           originalAmount: 500000, date: "2026-07-12" }, [], TODAY);
      eq(Validate.repayment({ amount: 600000, date: TODAY }, v).ok, false);
      eq(Validate.repayment({ amount: 500000, date: TODAY }, v).ok, true);
    });
    it("refuses an unknown currency or a nonsense week start", function () {
      eq(Validate.profile({ currencyCode: "XYZ" }).ok, false);
      eq(Validate.profile({ weekStartsOn: 3 }).ok, false);
      eq(Validate.profile({ currencyCode: "INR", weekStartsOn: 1 }).ok, true);
    });
  });

  /* ═══════════ Phase 4: the write path ═══════════
     Actions are the only way anything is written, so this is where invalid
     data would get in if validation were skipped. UI and App are stubbed,
     because these tests are about the data, not the screen. */

  window.UI = window.UI || { banner: function () {}, clearBanner: function () {} };
  window.App = window.App || { refresh: function () {} };

  function seedStore() {
    var fs = fakeStorage();
    Store.__setBackend(fs);
    Store.load();
    return fs;
  }
  function catId(name) {
    var found = Store.get().categories.filter(function (c) { return c.name === name; });
    return found.length ? found[0].id : null;
  }

  describe("actions: writing an expense", function () {
    seedStore();
    var food = catId("Food");

    it("writes a valid expense and reports that it persisted", function () {
      var r = Actions.addExpense({ amount: 42000, categoryId: food, date: Dates.today() });
      eq(r.ok, true);
      eq(r.persisted, true);
      eq(Store.get().expenses.length, 1);
      eq(Store.get().expenses[0].amount, 42000);
    });
    it("refuses an expense with no amount and writes nothing", function () {
      var before = Store.get().expenses.length;
      var r = Actions.addExpense({ amount: null, categoryId: food, date: Dates.today() });
      eq(r.ok, false);
      ok(r.errors.amount, "there must be a message for the amount field");
      eq(Store.get().expenses.length, before);
    });
    it("refuses a category that does not exist", function () {
      var r = Actions.addExpense({ amount: 1000, categoryId: "nope", date: Dates.today() });
      eq(r.ok, false);
      ok(r.errors.categoryId);
    });
    it("refuses a date in the future", function () {
      var r = Actions.addExpense({ amount: 1000, categoryId: food, date: Dates.addDays(Dates.today(), 1) });
      eq(r.ok, false);
      ok(r.errors.date);
    });
    it("edits an expense, and validates the result of the edit", function () {
      var id = Store.get().expenses[0].id;
      eq(Actions.updateExpense(id, { amount: 90000 }).ok, true);
      eq(Store.byId("expenses", id).amount, 90000);
      eq(Actions.updateExpense(id, { amount: 0 }).ok, false);
      eq(Store.byId("expenses", id).amount, 90000, "a refused edit must leave the record alone");
    });
    it("deletes an expense", function () {
      var id = Store.get().expenses[0].id;
      eq(Actions.removeExpense(id).ok, true);
      eq(Store.byId("expenses", id), null);
    });
  });

  describe("actions: an edit moves every dependent figure", function () {
    seedStore();
    var food = catId("Food");
    var today = Dates.today();
    var period = Dates.monthPeriod(today);
    Actions.setBudget("monthly", 2500000);
    Actions.addExpense({ amount: 600000, categoryId: food, date: today });
    var id = Store.get().expenses[0].id;

    function progress() {
      var s = Store.get();
      return Budget.progress(Budget.resolveForPeriod(s.budgets, period).amount, s.expenses, period);
    }

    it("starts where it should", function () {
      eq(progress().spent, 600000);
      eq(progress().remaining, 1900000);
    });
    it("doubling the expense doubles the spend and halves nothing else silently", function () {
      Actions.updateExpense(id, { amount: 1200000 });
      eq(progress().spent, 1200000);
      eq(progress().remaining, 1300000);
      eq(Analytics.analyse(Store.get().expenses, period).byCategory[0].total, 1200000);
    });
    it("moving it to last month empties this month", function () {
      Actions.updateExpense(id, { date: Dates.addDays(period.start, -1) });
      eq(progress().spent, 0);
      eq(progress().remaining, 2500000);
    });
    it("deleting it leaves the budget untouched and the spend at zero", function () {
      Actions.removeExpense(id);
      eq(progress().spent, 0);
      eq(progress().budget, 2500000);
    });
  });

  describe("actions: categories", function () {
    seedStore();
    var food = catId("Food");

    it("creates a custom category", function () {
      var r = Actions.addCategory({ name: "Coffee", tint: "clay" });
      eq(r.ok, true);
      eq(r.value.isDefault, false);
    });
    it("refuses a duplicate name", function () {
      eq(Actions.addCategory({ name: "coffee" }).ok, false);
    });
    it("never orphans an expense when a category goes", function () {
      var coffee = catId("Coffee");
      Actions.addExpense({ amount: 24000, categoryId: coffee, date: Dates.today() });
      Actions.removeCategory(coffee);
      var orphans = Store.get().expenses.filter(function (e) { return !Store.byId("categories", e.categoryId); });
      eq(orphans.length, 0);
      eq(Store.get().expenses[0].categoryId, Actions.miscellaneousId());
    });
    it("archives a default category rather than deleting it", function () {
      Actions.removeCategory(food);
      var still = Store.byId("categories", food);
      ok(still, "the seeded record stays");
      eq(still.isArchived, true);
      eq(Actions.categories().filter(function (c) { return c.id === food; }).length, 0);
    });
    it("refuses to remove Miscellaneous, since it is the fallback", function () {
      eq(Actions.removeCategory(Actions.miscellaneousId()).ok, false);
    });
  });

  describe("actions: budgets stay append only", function () {
    seedStore();
    var today = Dates.today();

    it("writes a budget effective from the start of this month", function () {
      Actions.setBudget("monthly", 2500000);
      eq(Store.get().budgets.length, 1);
      eq(Store.get().budgets[0].effectiveFrom, Dates.monthPeriod(today).start);
    });
    it("changing it in the same month replaces rather than stacking", function () {
      Actions.setBudget("monthly", 3000000);
      eq(Store.get().budgets.length, 1);
      eq(Store.get().budgets[0].amount, 3000000);
    });
    it("keeps monthly and weekly as separate records", function () {
      Actions.setBudget("weekly", 700000);
      eq(Store.get().budgets.length, 2);
    });
    it("refuses a budget of zero", function () {
      eq(Actions.setBudget("monthly", 0).ok, false);
    });
  });

  /* ── summary ── */
  var summary = document.getElementById("summary");
  summary.setAttribute("data-status", failed ? "fail" : "pass");
  summary.textContent = failed
    ? failed + " failed, " + passed + " passed"
    : "all " + passed + " passed";
})();
